<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="./resources/style.css">
        <script type="module">
            import { log, stringify, currentNetwork, rpcUrl } from './resources/utils.js';

            import * as kaspa from '../../web/kaspa-rpc/kaspa.js';
            let { RpcClient } = kaspa;

            (async () => {
                await kaspa.default('../../web/kaspa-rpc/kaspa_bg.wasm');

                let networkId = currentNetwork();
                log(`Connecting to SLUG network...`);
                log(`Selected network is ${networkId}...`);
                
                const rpc = new RpcClient({
                    url: rpcUrl(networkId),
                    networkId,
                });

                await rpc.connect();
                log("Connected to", rpc.url);
                
                log("GetBlockDagInfo request...");
                const info = await rpc.getBlockDagInfo();
                log("GetBlockDagInfo response:", info);

                log("Disconnected...");
                await rpc.disconnect();
            })();

        </script>
    </head>
    <body></body>
</html>
